<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频创作</title>
<link rel="icon" type="image/svg+xml" href="/video-creation.svg">
<script>
  /* 独立浏览器先恢复本地偏好；原生宿主最多等待 1.5 秒读取真实外观，避免错误主题闪屏。 */
  (function () {
    var t = 'dark';
    try { t = localStorage.getItem('openfilm.theme') || 'dark'; } catch (e) {}
    if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'dark';
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
    if (window.top === window && window.desirecoreApp) {
      document.documentElement.dataset.appearancePending = 'true';
      setTimeout(function () { delete document.documentElement.dataset.appearancePending; }, 1500);
    }
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
