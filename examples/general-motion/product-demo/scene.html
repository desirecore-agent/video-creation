<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>灵感工作台 · 无旁白产品演示</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152b;color:#f5f4ff;font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}body{background:radial-gradient(ellipse at 80% 10%,#343055,transparent 65%),#10152b;--small:clamp(8px,2.6vw,24px);--body:clamp(8px,2.8vw,27px)}#canvas{height:100%;padding:5.5vh 6vw;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:3vh;overflow:hidden}header{position:relative;z-index:2}.label{font-size:var(--small);letter-spacing:.1em;color:#a7adce}h1{margin:.18em 0 0;font-size:min(6.3vw,96px);font-weight:700;letter-spacing:-.035em;line-height:1.16}#subtitle{margin-top:.45em;font-size:var(--body);line-height:1.45;color:#bbc1db}#scene{position:relative;min-height:0;overflow:hidden}.orb{position:absolute;right:0;top:0;width:50%;aspect-ratio:1;border:1px solid #938cff30;border-radius:50%;box-shadow:0 0 8vw #7e6aff18;pointer-events:none}#screen{overflow:hidden;position:absolute;inset:0 5%;display:flex;align-items:center;justify-content:center;transform-origin:65% 65%}#screen img{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:1vw;box-shadow:0 2vh 6vw #0007}#route{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}#route path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}#cursor{fill:#fff;stroke:#10152b;stroke-width:2}.note{position:absolute;z-index:5;padding:.45em .75em;border:1px solid #ffffff40;border-radius:100px;background:#292b48ed;font-size:var(--small);line-height:1.4;white-space:nowrap}.note b{color:var(--accent)}#note1{left:0;top:8%}#note2{right:0;bottom:6%}#cards{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3%;z-index:6}.card{min-width:0;min-height:0;border-radius:2vw;border:1px solid #ffffff25;background:#252943f5;padding:7%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;box-shadow:0 2vh 5vw #0002;will-change:transform,opacity}.icon{width:30%;max-width:100px;aspect-ratio:1;border-radius:30%;background:var(--accent);color:#171b33;font-size:clamp(12px,5vw,54px);display:grid;place-items:center;flex:none}.card h2{font-size:clamp(12px,3.8vw,46px);line-height:1.2;margin:.35em 0 .3em}.card p{text-wrap:balance;color:#c1c7df;line-height:1.5;font-size:var(--body);margin:0}#finish{position:absolute;inset:0;z-index:7;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2vh}#finish strong{font-size:min(7vw,100px);letter-spacing:-.04em;line-height:1.2}#finish span{color:#bcc4df;font-size:var(--body);line-height:1.5}#badge{border-radius:100px;background:var(--accent);color:#142a30;font-size:var(--body);padding:.45em 1.2em}footer{display:grid;gap:1.5vh;position:relative;z-index:8}#beat{display:flex;gap:.4em;align-items:center;color:#aab3d5;font-size:var(--small);line-height:1.3}#beat i{height:1.15em;width:max(4px,.25em);background:var(--accent);border-radius:8px;display:block;flex:none}#beat span{margin-left:.3em}#progress{height:clamp(1px,.2vh,3px);background:#ffffff20}#progress i{display:block;height:100%;background:var(--accent);transform-origin:left}
@media(max-aspect-ratio:3/4){#canvas{padding:5vh 7vw;gap:2.5vh}h1{font-size:min(9.5vw,96px)}#subtitle{font-size:clamp(9px,4.5vw,28px)}#cards{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:5%}.card{padding:5%;display:grid;grid-template-columns:20% minmax(0,1fr);grid-template-rows:auto auto;column-gap:7%;align-content:center;border-radius:4vw}.icon{grid-row:1/3;width:100%;font-size:clamp(17px,8vw,54px)}.card h2{font-size:clamp(12px,6.5vw,46px);margin:0 0 .2em}.card p{font-size:clamp(9px,4.5vw,27px)}#finish strong{font-size:min(10vw,100px)}#finish span,#badge{font-size:clamp(10px,4.5vw,28px)}.note{font-size:clamp(8px,4vw,24px)}#note1{top:12%}#note2{bottom:12%}}

@media(min-aspect-ratio:3/4) and (max-aspect-ratio:1/1){#cards{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:4%}.card{padding:2%;display:grid;grid-template-columns:13% minmax(0,1fr);grid-template-rows:auto auto;column-gap:5%;row-gap:.1em;align-content:center}.icon{grid-row:1/3;width:100%;max-width:36px;font-size:17px}.card h2{font-size:12.5px;margin:0}.card p{font-size:9.5px;margin:0}}
</style>
<script id="film-motion" type="application/json">
{"version":1,"id":"general-product-demo","name":"无旁白产品演示","description":"原创虚构工作台：局部镜头、SVG路径引导、分组卡片与合成音乐，无需字幕或旁白。","paramsSchema":{"$schema":"http://json-schema.org/draft-07/schema#","type":"object","additionalProperties":false,"properties":{"title":{"type":"string","maxLength":36,"description":"主标题，直接进入场景渲染。"},"accent":{"type":"string","pattern":"^#[0-9a-fA-F]{6}$","description":"标注、路径与节拍的强调色。"},"cameraZoom":{"type":"number","minimum":0.8,"maximum":1.5,"description":"界面镜头缩放，可使用属性关键帧。"}}},"defaults":{"title":"让灵感，成为作品","accent":"#9be6ce","cameraZoom":1},"assets":["assets/workspace.svg","assets/original-music.wav","motion.mjs"]}
</script></head><body><div id="canvas"><header data-layout-box="header"><div class="label" data-layout-text>原创产品演示</div><h1 id="title" data-layout-text></h1><div id="subtitle" data-layout-text>把想法、素材和交付，连接在一个空间</div></header><main id="scene" data-layout-box="scene"><div class="orb"></div><div id="screen"><img src="assets/workspace.svg" alt="原创虚构工作台界面"></div><svg id="route" viewBox="0 0 1920 1080" preserveAspectRatio="none"><path id="line" d="M250 630C580 400 850 550 1110 760S1520 720 1690 560"/><circle id="cursor" r="12"/></svg><div class="note" id="note1" data-layout-text><b>01</b> 收集想法</div><div class="note" id="note2" data-layout-text><b>02</b> 聚焦一处，继续创作</div><div id="cards"><div class="card" data-layout-subject><div class="icon">✦</div><h2 data-layout-text>收集</h2><p data-layout-text>灵感，各有位置</p></div><div class="card" data-layout-subject><div class="icon">↗</div><h2 data-layout-text>编排</h2><p data-layout-text>给表达，添上节奏</p></div><div class="card" data-layout-subject><div class="icon">✓</div><h2 data-layout-text>交付</h2><p data-layout-text>完成一次清晰交付</p></div></div><div id="finish"><strong data-layout-text>想法有了形状</strong><span data-layout-text>从灵感开始，去完成下一件作品</span><div id="badge" data-layout-text>现在，开始创作 ↗</div></div></main><footer data-layout-box="footer"><div id="beat"><i></i><i></i><i></i><i></i><span data-layout-text>原创合成音乐 · 120 BPM</span></div><div id="progress"><i></i></div></footer></div>
<script type="module">
import { mix } from './motion.mjs';
const manifest = JSON.parse(document.getElementById('film-motion').textContent);
const byId = (id) => document.getElementById(id);
const progress = (t,a,b) => Math.max(0,Math.min(1,(t-a)/(b-a)));
const smooth = (v) => v*v*(3-2*v);
const show = (id,opacity,y=0) => {const e=byId(id);e.style.opacity=opacity;e.style.transform=`translateY(${y}px)`;};
window.film={duration:24,frame(t,context={}){
  const p={...manifest.defaults,...context.params};const w=context.viewport?.width??innerWidth;const h=context.viewport?.height??innerHeight;
  document.body.classList.toggle('portrait',h>w);document.body.style.setProperty('--accent',p.accent);byId('title').textContent=p.title;
  const intro=smooth(progress(t,0,1.2));const cardsIn=smooth(progress(t,12,13));const finish=smooth(progress(t,20,21));
  show('title',intro*(1-finish),mix(35,0,intro));show('subtitle',smooth(progress(t,.5,1.5))*(1-cardsIn));byId('subtitle').style.display=cardsIn===1?'none':'block';
  const screen=byId('screen');screen.style.opacity=intro*(1-cardsIn);screen.style.transform=`translateY(${mix(90,0,intro)}px)`;screen.firstElementChild.style.transform=`scale(${p.cameraZoom}) rotate(${mix(-3,0,smooth(progress(t,1,6)))}deg)`;
  const line=byId('line');const route=smooth(progress(t,3,8));line.style.strokeDasharray=line.getTotalLength();line.style.strokeDashoffset=line.getTotalLength()*(1-route);byId('route').style.opacity=(1-cardsIn)*progress(t,2,3);
  const point=line.getPointAtLength(line.getTotalLength()*route);byId('cursor').setAttribute('cx',point.x);byId('cursor').setAttribute('cy',point.y);
  show('note1',smooth(progress(t,3,4))*(1-cardsIn),mix(20,0,smooth(progress(t,3,4))));show('note2',smooth(progress(t,7,8))*(1-cardsIn),mix(20,0,smooth(progress(t,7,8))));
  byId('cards').style.opacity=1-finish;[...document.querySelectorAll('.card')].forEach((e,i)=>{const q=smooth(progress(t,12+i*.35,13+i*.35));e.style.opacity=q;e.style.transform=`translateY(${mix(100,0,q)}px) scale(${mix(.94,1,q)})`;});
  show('finish',finish,mix(40,0,finish));[...document.querySelectorAll('#beat i')].forEach((e,i)=>{e.style.opacity=i===0&&t<1?0:1;e.style.transform=`scaleY(${.3+.7*Math.exp(-((t+i*.125)%.5)*7)})`;});byId('progress').firstElementChild.style.transform=`scaleX(${progress(t,0,24)})`;
  document.body.dataset.event=t>=1?'on':'off';document.body.dataset.sample='product-demo';
}};
</script></body></html>
