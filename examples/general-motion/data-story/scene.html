<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>从数据到判断</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f3ed;color:#1b2d31;font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}body{--small:clamp(8px,2.6vw,24px);--body:clamp(8.5px,2.8vw,28px)}#canvas{height:100%;padding:5.5vh 6vw;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:3vh}#grid{position:absolute;inset:0;background-image:linear-gradient(#183a350b 1px,transparent 1px),linear-gradient(90deg,#183a350b 1px,transparent 1px);background-size:5vw 5vw;pointer-events:none}header,footer{position:relative;z-index:1}.eyebrow{font-size:var(--small);color:#617a6f;letter-spacing:.1em}h1{margin:.2em 0 0;font-size:min(6.3vw,96px);line-height:1.16;letter-spacing:-.04em}#dashboard{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,30%);gap:4%}#plot{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:1.5vh;min-width:0;min-height:0}#chart{display:block;width:100%;height:100%;min-height:0;overflow:visible}.axis{stroke:#223e3827;stroke-width:4}.tick{font-size:var(--svg-font,24px);fill:#61786b}.axis-label{font-size:calc(var(--svg-font,24px)*.8);fill:#61786b}.line{fill:none;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}.dot{stroke:#f5f3ed;stroke-width:6}#legend{display:flex;align-items:center;justify-content:space-between;gap:2%;min-width:0}.legend{display:flex;align-items:center;gap:.45em;font-size:var(--body);line-height:1.2;white-space:nowrap}.legend i{width:.65em;height:.65em;border-radius:50%;flex:none}#details{display:flex;flex-direction:column;justify-content:center;gap:2vh;min-width:0;min-height:0}#summary small{display:block;font-size:var(--small);color:#61786b;line-height:1.3}#number{font-size:clamp(25px,9vw,116px);font-weight:650;letter-spacing:-.05em;line-height:1.05;margin-top:.12em}#annotation{text-wrap:balance;padding:.6em .7em;border-radius:1vw;background:#fff;box-shadow:0 1vh 4vw #173d3510;font-size:var(--body);line-height:1.45;border-left:.2em solid var(--accent);overflow-wrap:anywhere}footer{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:.4em 1em}#caption{font-size:var(--body);line-height:1.4;color:#536b62}#count{color:var(--accent);font-weight:700}#stamp{font-size:var(--small);line-height:1.4;color:#758b7e}#end{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2vh;background:#f5f3ed;text-align:center}#end b{font-size:min(7vw,100px);letter-spacing:-.04em;line-height:1.2}#end span{font-size:var(--body);line-height:1.5;color:#617a6e}
@media(max-aspect-ratio:3/4){#canvas{padding:5vh 7vw;gap:2.5vh}h1{font-size:min(9.5vw,96px)}#dashboard{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:3vh}#details{grid-row:1;display:grid;grid-template-columns:42% minmax(0,1fr);gap:7%;align-items:center}#plot{grid-row:2;gap:2vh}#number{font-size:clamp(28px,16vw,116px)}#annotation{font-size:clamp(8.5px,4.5vw,28px);border-radius:2vw}#summary small,.legend{font-size:clamp(8px,4.5vw,28px)}footer{flex-direction:column;gap:.5em}#caption,#end span{font-size:clamp(9px,4.5vw,28px)}#end b{font-size:min(10vw,100px)}}
</style><script id="film-motion" type="application/json">
{"version":1,"id":"general-data-story","name":"从数据到判断","description":"原创教学数据可视化：结构化数列、SVG路径描线、数字与注释联动，数据与样式可编辑。","paramsSchema":{"$schema":"http://json-schema.org/draft-07/schema#","type":"object","additionalProperties":false,"properties":{"title":{"type":"string","maxLength":36,"description":"数据解释片标题。"},"accent":{"type":"string","pattern":"^#[0-9a-fA-F]{6}$","description":"主系列及注释颜色。"},"reveal":{"type":"number","minimum":0,"maximum":1,"description":"图表揭示进度，支持关键帧。"}}},"defaults":{"title":"从数据，走向判断","accent":"#287d65","reveal":1},"dataSchema":{"$schema":"http://json-schema.org/draft-07/schema#","type":"object","additionalProperties":false,"required":["labels","series","note"],"properties":{"labels":{"type":"array","minItems":4,"maxItems":4,"items":{"type":"string","maxLength":12},"description":"横轴四个季度标签。"},"series":{"type":"array","minItems":3,"maxItems":3,"description":"三组原创演示数据，不代表真实业务指标。","items":{"type":"object","additionalProperties":false,"required":["name","values","color"],"properties":{"name":{"type":"string","maxLength":16,"description":"图例名称。"},"values":{"type":"array","minItems":4,"maxItems":4,"items":{"type":"number","minimum":0,"maximum":100},"description":"各季度0至100的演示数值。"},"color":{"type":"string","pattern":"^#[0-9a-fA-F]{6}$","description":"该系列的描线颜色。"}}}},"note":{"type":"string","maxLength":60,"description":"图表上的解释性注释。"}}},"data":{"labels":["第一季","第二季","第三季","第四季"],"series":[{"name":"理解","values":[24,42,66,88],"color":"#287d65"},{"name":"实践","values":[18,31,58,76],"color":"#dc9f53"},{"name":"复盘","values":[12,28,39,64],"color":"#818eb9"}],"note":"持续实践，让理解变成可用的能力"},"assets":["motion.mjs"]}
</script></head><body><div id="grid"></div><div id="canvas"><header data-layout-box="header"><div class="eyebrow" data-layout-text>原创演示数据</div><h1 id="title" data-layout-text></h1></header><main id="dashboard" data-layout-box="scene"><div id="plot"><svg id="chart" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" data-layout-subject><g id="axes"></g><g id="curves"></g><g id="labels"></g></svg><div id="legend"></div></div><aside id="details"><div id="summary"><small data-layout-text>本期学习进度</small><div id="number" data-layout-text>0%</div></div><div id="annotation" data-layout-text></div></aside><div id="end"><b data-layout-text>让数据，讲清楚变化</b><span data-layout-text>数值可以修改，判断仍由你完成</span></div></main><footer data-layout-box="footer"><div id="caption" data-layout-text>四个季度，<span id="count">三个视角</span></div><div id="stamp" data-layout-text>原创数据 · 非真实业务指标</div></footer></div>
<script type="module">
import { mix } from './motion.mjs';
const manifest=JSON.parse(document.getElementById('film-motion').textContent);const id=(n)=>document.getElementById(n);const q=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));const smooth=(v)=>v*v*(3-2*v);const ns='http://www.w3.org/2000/svg';
const make=(tag,attrs,text)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e;};let last='';
function build(data,accent){const key=JSON.stringify([data,accent]);if(last===key)return;last=key;id('axes').replaceChildren();id('labels').replaceChildren();id('curves').replaceChildren();id('legend').replaceChildren();
  for(let n=0;n<=4;n++){const y=570-n*122.5;id('axes').append(make('line',{class:'axis',x1:220,y1:y,x2:1060,y2:y}));id('labels').append(make('text',{class:'axis-label','data-layout-text':'',x:5,y:y+7},n*25));}
  data.labels.forEach((text,i)=>id('labels').append(make('text',{class:'tick','data-layout-text':'',x:220+i*280,y:660,'text-anchor':'middle'},text)));
  data.series.forEach((s,i)=>{const color=i===0?accent:s.color;const points=s.values.map((v,k)=>[220+k*280,570-v*4.9]);const group=make('g',{'data-series':i});const path=make('path',{class:'line',stroke:color,d:points.map(([x,y],k)=>`${k?'L':'M'}${x} ${y}`).join(' ')});group.append(path);points.forEach(([cx,cy])=>group.append(make('circle',{class:'dot',cx,cy,r:9,fill:color})));id('curves').append(group);const row=document.createElement('div');row.className='legend';const dot=document.createElement('i');dot.style.background=color;const label=document.createElement('span');label.textContent=s.name;label.dataset.layoutText='';row.append(dot,label);id('legend').append(row);});
}
window.film={duration:24,frame(t,context={}){const p={...manifest.defaults,...context.params};const data=context.data??manifest.data;document.body.style.setProperty('--accent',p.accent);document.body.classList.toggle('portrait',(context.viewport?.height??innerHeight)>(context.viewport?.width??innerWidth));id('title').textContent=p.title;build(data,p.accent);const chartRect=id('chart').getBoundingClientRect();const chartScale=Math.min(chartRect.width/1200,chartRect.height/700);id('chart').style.setProperty('--svg-font',`${Math.max(24,10/chartScale)}px`);
  const reveal=Math.min(p.reveal,smooth(q(t,2,13)));[...id('curves').children].forEach((group,i)=>{const r=Math.max(0,Math.min(1,(reveal-i*.06)/.88));const path=group.firstElementChild;path.style.strokeDasharray=path.getTotalLength();path.style.strokeDashoffset=path.getTotalLength()*(1-r);[...group.querySelectorAll('circle')].forEach((dot,k)=>{dot.style.opacity=r>=k/3?1:0;});});
  id('number').textContent=`${Math.round(mix(0,data.series[0].values[3],reveal))}%`;id('annotation').textContent=data.note;id('annotation').style.opacity=smooth(q(t,10,11));id('annotation').style.transform=`translateY(${mix(20,0,smooth(q(t,10,11)))}px)`;const end=smooth(q(t,20,21));id('end').style.opacity=end;id('end').style.transform=`translateY(${mix(30,0,end)}px)`;id('end').style.pointerEvents='none';id('plot').style.visibility=end===1?'hidden':'visible';id('details').style.visibility=end===1?'hidden':'visible';document.body.dataset.event=t>=1?'on':'off';document.body.dataset.sample='data-story';
}};
</script></body></html>
