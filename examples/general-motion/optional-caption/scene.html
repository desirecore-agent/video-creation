<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111d32;color:#f2f4ff;font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}body{--small:clamp(8px,2.6vw,24px);--body:clamp(8.5px,2.8vw,28px)}#particles{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}#layout{position:relative;height:100%;padding:5.5vh 6vw;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:2.4vh}.meta{display:flex;justify-content:space-between;align-items:center;gap:1em;font-size:var(--small);line-height:1.3;color:#9bb2d1}.eyebrow{letter-spacing:.08em}h1{margin:.22em 0 0;font-size:min(6.3vw,96px);line-height:1.16;letter-spacing:-.035em}#clock{white-space:nowrap;display:flex;align-items:center;gap:.6em;color:#8fa9cb}#beat{width:.55em;height:.55em;background:var(--accent);border-radius:50%;box-shadow:0 0 1em var(--accent)}#diagram{position:relative;min-height:0}#route{position:absolute;inset:0;width:100%;height:100%;overflow:visible}#path{stroke:#92a3bb50;stroke-width:4;fill:none}#tracer{fill:var(--accent)}#nodes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7%;align-items:stretch}.node{position:relative;min-width:0;min-height:0;will-change:transform,opacity;border:1px solid #92a3bb4d;border-radius:2.5vw;background:#1e304c;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6%;gap:.3em;box-shadow:0 1vh 3vw #050d1a35}.node.active{border-color:var(--accent);background:#293d5b}.node i{font-size:clamp(16px,6vw,72px);line-height:1;font-style:normal;color:var(--accent)}.node b{font-size:clamp(12px,3.9vw,48px);line-height:1.2}.node span{text-wrap:balance;color:#b1c5df;font-size:var(--body);line-height:1.4;text-align:center}#note{text-align:center;font-size:var(--body);line-height:1.4;color:#bbcee5}#captions{text-align:center;font-size:clamp(10px,3.2vw,40px);font-weight:500;line-height:1.5;min-height:1.5em}#captions span{ window.film={duration:24,frame(t,context={}){const p={...manifest.defaults,...context.params};const data=context.data??manifest.data;const w=context.viewport?.width??innerWidth;const h=context.viewport?.height??innerHeight;document.body.classList.toggle('portrait',h>w);document.body.style.setProperty('--accent',p.accent);id('title').textContent=p.title;

  const active=data.events.find(e=>t>=e.start&&t<e.end);[...document.querySelectorAll('.node')].forEach((node,i)=>{const reveal=clamp(spring(t-i*.25,{stiffness:90,damping:16}));node.style.opacity=reveal;node.style.transform=`translateY(${mix(60,0,reveal)}px) scale(${mix(.92,1,reveal)})`;node.classList.toggle('active',active?.node===i);});
  const points=h>=w?[[600,30],[600,150],[600,270]]:[[180,150],[600,150],[1020,150]];id('path').setAttribute('d',points.map(([x,y],i)=>`${i?'L':'M'}${x} ${y}`).join(' '));const point=samplePath(points,clamp(t/18));id('tracer').setAttribute('cx',point.x);id('tracer').setAttribute('cy',point.y);id('captions').style.display=p.showCaptions&&active?'block':'none';id('captions').firstElementChild.textContent=active?.text??'';id('note').textContent=active?['让一个想法有明确的方向','让草稿承载结构与节奏','让检查成为交付的一部分'][active.node]:'';id('beat').style.opacity=.3+.7*Math.exp(-(t%.5)*10);const closing=clamp((t-20)/1);id('end').style.opacity=closing;id('nodes').style.visibility=closing===1?'hidden':'visible';id('route').style.visibility=closing===1?'hidden':'visible';document.body.dataset.event=t>=1?'on':'off';document.body.dataset.sample='optional-caption';
