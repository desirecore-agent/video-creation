<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>透明标题层</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}#badge{position:absolute;left:7%;right:7%;bottom:15%;padding:4%;border-radius:2vw;color:white;background:#15263de8;border:1px solid #ffffff40;box-shadow:0 1vh 3vw #0003;display:grid;grid-template-columns:12% minmax(0,1fr);gap:4%;align-items:center}#mark{width:100%;aspect-ratio:1;background:var(--accent);border-radius:25%;display:grid;place-items:center;color:#192d36;font-size:clamp(14px,5vw,72px)}h1{margin:0;font-size:clamp(11px,4.2vw,72px);letter-spacing:-.03em;line-height:1.2}p{margin:.5em 0 0;font-size:clamp(8px,2.3vw,30px);line-height:1.4;color:#bbcadc}#line{position:absolute;left:7%;bottom:12%;width:86%;height:clamp(1px,.3vh,4px);background:var(--accent);transform-origin:left}
</style><script id="film-motion" type="application/json">
{"version":1,"id":"general-alpha-title","name":"透明标题层","description":"原创透明标题、图形与路径。用于WebM或ProRes 4444 MOV，并在异色背景上核验合成。","paramsSchema":{"$schema":"http://json-schema.org/draft-07/schema#","type":"object","additionalProperties":false,"properties":{"title":{"type":"string","maxLength":36,"description":"透明标题文字。"},"accent":{"type":"string","pattern":"^#[0-9a-fA-F]{6}$","description":"标记和描线颜色。"}}},"defaults":{"title":"让灵感，成为作品","accent":"#9be6ce"},"assets":["motion.mjs"]}
</script></head><body><div id="badge" data-layout-box="scene" data-layout-subject><div id="mark">✦</div><div><h1 id="title" data-layout-text></h1><p data-layout-text>透明动效层 · 可叠加在任意画面</p></div></div><div id="line"></div><script type="module">
import {mix,ease} from './motion.mjs';const manifest=JSON.parse(document.getElementById('film-motion').textContent);window.film={duration:6,frame(t,context={}){const p={...manifest.defaults,...context.params};document.body.style.setProperty('--accent',p.accent);document.getElementById('title').textContent=p.title;const enter=ease(Math.max(0,Math.min(1,t/.8)),'ease-out');const leave=ease(Math.max(0,Math.min(1,(t-5)/.8)),'ease-in');const badge=document.getElementById('badge');badge.style.opacity=enter*(1-leave);badge.style.transform=`translateY(${mix(80,0,enter)+leave*30}px)`;document.getElementById('line').style.transform=`scaleX(${enter*(1-leave)})`;document.body.dataset.sample='alpha-title';}};
</script></body></html>
