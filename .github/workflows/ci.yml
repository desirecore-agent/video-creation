name: Video creation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-creation-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:reliability
      - run: pnpm test:regressions
      - run: pnpm test:motion
      - run: node --test --test-concurrency=1 packages/openfilm/studio/ui/src/lib/desirecore-host.test.ts packages/openfilm/studio/ui/src/lib/host-appearance.test.ts packages/openfilm/studio/ui/src/lib/export-jobs.test.ts
# Distribution is owned by DesireCore. No npm publication, desktop installer or upstream feed is triggered here.
